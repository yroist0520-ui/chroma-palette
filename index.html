<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CHROMA · 基于图片与文案的智能文字配色</title>
  <meta name="description" content="上传一张图片，输入一段文案：系统读取图片真实像素决定颜色范围，判断文案情绪决定方向，按 WCAG 对比度过滤，生成可直接用于图片排版的文字配色。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d8ff3e' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere-grid"></div>
    <div class="atmosphere-glow"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      </span>
      <div class="brand-text">
        <strong>CHROMA</strong>
        <span>图片定范围 · 文案定情绪 · 可读性定采用</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="sampleBtn" type="button">示例图</button>
      <button class="btn btn-ghost" id="reanalyzeBtn" type="button" disabled>重新分析</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左列：上传区 + 实际预览区（同一块画布） -->
    <section class="stage-col">
      <div id="stage" class="stage">
        <div id="dropzone" class="dropzone">
          <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/>
          </svg>
          <p class="dz-title">点击或拖入一张图片</p>
          <p class="dz-sub">JPG / PNG / WebP · 全程本地分析，图片不会离开浏览器</p>
          <div class="dz-actions">
            <button id="dzPick" class="btn btn-soft" type="button">选择图片</button>
            <button id="dzSample" class="btn btn-ghost" type="button">用示例图试试</button>
          </div>
        </div>
        <div id="frame" class="frame" hidden>
          <img id="previewImg" alt="上传图片的预览" draggable="false" />
          <div id="overlay" class="overlay" tabindex="0" role="group" aria-label="文字预览框，可拖动调整位置">
            <div id="overlayScrim" class="ov-scrim" hidden></div>
            <div id="overlayText" class="ov-inner">
              <div id="ovAccent" class="ov-accent" hidden></div>
              <h2 id="ovTitle" class="ov-title"></h2>
              <p id="ovBody" class="ov-body"></p>
            </div>
          </div>
          <div id="frameHint" class="frame-hint">拖动文字框到你想放文字的位置，配色会按该区域重新计算</div>
        </div>
        <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" hidden />
      </div>
      <div class="stage-foot">
        <button id="replaceBtn" class="btn btn-ghost" type="button" hidden>更换图片</button>
        <span id="imgMeta" class="meta"></span>
      </div>
      <!-- 可读性检查条：标题 / 正文 / 强调 三角色的真实对比度 -->
      <div id="contrastStrip" class="contrast-strip" hidden></div>
    </section>

    <!-- 右列：文案 → 主按钮 → 结果 -->
    <section class="panel-col">
      <div class="panel">
        <label class="p-label" for="copyInput">文案</label>
        <textarea id="copyInput" rows="4" placeholder="写下你要放在图上的文字。&#10;第一行会成为标题；「引号」里的短词会成为强调词。"></textarea>
        <div class="mood-row">
          <span class="p-sub">情绪</span>
          <div id="moodChips" class="chips" role="radiogroup" aria-label="文案情绪"></div>
        </div>
        <p id="moodRead" class="mood-read" hidden></p>
      </div>

      <div class="panel panel-action">
        <button id="generateBtn" class="btn-primary" type="button">生成配色</button>
        <p id="staleHint" class="stale-hint" hidden></p>
      </div>

      <div class="panel" id="resultPanel" hidden>
        <div class="p-head">
          <span class="p-label">配色方案</span>
          <span id="bgTypeBadge" class="badge"></span>
        </div>
        <div id="bgSummary" class="bg-summary"></div>
        <div id="schemeList" class="scheme-list"></div>
      </div>

      <!-- 高级区（折叠）：保留原有排版调整 / 原色驱动增强 / 导出能力 -->
      <details class="adv" id="advPanel" hidden>
        <summary>高级：排版 · 取色增强 · 导出</summary>
        <div class="adv-body">
          <div class="grid2">
            <label class="f-row">字号<input id="sizeRange" type="range" min="18" max="88" value="40" /><output id="sizeVal">40</output></label>
            <label class="f-row">文字框宽<input id="widthRange" type="range" min="24" max="92" value="62" /><output id="widthVal">62%</output></label>
            <label class="f-row">行高<input id="lhRange" type="range" min="90" max="200" value="135" /><output id="lhVal">1.35</output></label>
            <label class="f-row">字距<input id="lsRange" type="range" min="-5" max="30" value="2" /><output id="lsVal">0.02em</output></label>
          </div>
          <div class="grid2">
            <label class="f-row">字重
              <select id="weightSelect"><option value="400">常规</option><option value="600">半粗</option><option value="700" selected>粗体</option><option value="900">特粗</option></select>
            </label>
            <label class="f-row">对齐
              <select id="alignSelect"><option value="left" selected>左对齐</option><option value="center">居中</option><option value="right">右对齐</option></select>
            </label>
          </div>
          <div class="toggle-row">
            <button id="strokeToggle" class="toggle" type="button" role="switch" aria-checked="true">描边</button>
            <button id="shadowToggle" class="toggle" type="button" role="switch" aria-checked="true">阴影</button>
            <button id="scrimToggle" class="toggle" type="button" role="switch" aria-checked="false">文字底衬</button>
            <button id="resetBtn" class="btn btn-ghost" type="button">恢复默认排版</button>
          </div>

          <div class="adv-sep"></div>
          <p class="p-sub">原色驱动增强（手动）</p>
          <div class="src-row">
            <span id="srcChip" class="chip-swatch"></span>
            <div class="src-meta"><span id="srcHex" class="mono">—</span><span id="srcHsl" class="meta"></span></div>
            <button id="srcPickBtn" class="btn btn-ghost" type="button">吸色</button>
            <button id="resetSourceBtn" class="btn btn-ghost" type="button">用主色</button>
          </div>
          <div class="grid2">
            <label class="f-row">明度 ΔL<input id="enhanceL" type="range" min="-30" max="30" value="0" /><output id="valL">0%</output></label>
            <label class="f-row">色度 ΔC<input id="enhanceC" type="range" min="-30" max="30" value="0" /><output id="valC">0%</output></label>
          </div>
          <div id="variantRow" class="variant-row"></div>

          <div class="adv-sep"></div>
          <div class="export-row">
            <button id="copyHexBtn" class="btn btn-soft" type="button" disabled>复制色值</button>
            <button id="copyCssBtn" class="btn btn-soft" type="button" disabled>复制 CSS 变量</button>
            <button id="pngBtn" class="btn btn-soft" type="button" disabled>色卡 PNG</button>
            <button id="jsonBtn" class="btn btn-soft" type="button" disabled>分析 JSON</button>
          </div>
        </div>
      </details>

      <p class="foot-note">对比度参考 WCAG 2.2 AA：正文 ≥ 4.5:1，大字 ≥ 3:1。所有分析在浏览器本地完成。</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="color-core.js"></script>
  <script src="mood-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
